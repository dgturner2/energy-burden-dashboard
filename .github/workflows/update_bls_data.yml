name: Update BLS Data Monthly

on:
  schedule:
    - cron: "0 12 5 * *"   # Runs on the 5th of every month at 12:00 UTC
  workflow_dispatch:       # Allows manual runs from GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run dataset build script
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          python src/build_dataset.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/bls_monthly.csv
          git commit -m "Automated monthly BLS data update" || echo "No changes to commit"
          git push
